# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: mine-csharp-ef-patterns
    name: "Mine C# source, project, and config files for EF6 patterns, inventory, and dependency risk"
    type: automatic
    steps:
      - name: "Scan .cs/.csproj/packages.config/App.config/Web.config/appsettings*.json and emit metrics per file"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
            - "**/*.csproj"
            - "**/packages.config"
            - "**/App.config"
            - "**/Web.config"
            - "**/appsettings*.json"
          exclude:
            - "**/node_modules/**"
            - "**/bin/**"
            - "**/obj/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/Migrations/**"
            - "**/packages/**"
            - "**/TestResults/**"


